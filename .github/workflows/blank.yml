# ====================== HANDLE ALL TEXT ======================
@bot.message_handler(func=lambda m: True)
def handle_all_text(message):
    chat_id = message.chat.id
    text = message.text.strip()

    # Ignore commands and button text
    if text.startswith('/') or text == "🔍 Search":
        return

    # Check if contains numbers (search query)
    if re.search(r'\d', text):
        wait_msg = bot.reply_to(message, "⏳ Searching... Please wait (may take 30-60 seconds)")
        threading.Thread(target=process_search_async, args=(chat_id, text, wait_msg.message_id), daemon=True).start()
    else:
        bot.send_message(chat_id, 
            "❌ Please send a valid pid report n\n"
            "Examples:\n"
            "• 9999999999\n"
            "• drugs\n"
            "• cp\n\n"
            "Or click 🔍 Search button.",
            reply_markup=get_main_keyboard()
        )

