# ====================== FORMAT REPORT ======================
def format_report(query, api_response):
    try:
        data = json.loads(api_response)
    except json.JSONDecodeError as e:
        return f"❌ Invalid JSON response: {str(e)}\n\nResponse: {api_response[:200]}"

    lines = []
    lines.append("🔍 **userid report INTELLIGENCE REPORT** 🔍")
    lines.append("")
    lines.append(f"📱 userid: {data.get('username', query)}")
    lines.append("🎡᪵𝆺𝅥⃝𝐇ᴀᴄᴋᴇʀ ◡‌⃝ㅤㅤ")
    lines.append("─────────────────────────────────")
    
    total = data.get('total_records', 0)
    if total > 0:
        lines.append(f"📋 Total: {total} records")
    else:
        lines.append("❌ No records found for this number")
        lines.append("")
        lines.append("🎡᪵𝆺𝅥⃝𝐇ᴀᴄᴋᴇʀ ◡‌⃝ㅤㅤ")
        lines.append("⏳ Auto-delete in 30 seconds...")
        return "\n".join(lines)
    
    lines.append("")
    
    records = data.get('records', [])
    if isinstance(records, dict):
        records = [records]
    
    for idx, rec in enumerate(records, 1):
        lines.append(f"RECORD {idx}")
        lines.append("─────────────────────────────────")
        if isinstance(rec, dict):
            for key, val in rec.items():
                if val is not None and str(val).strip():
                    lines.append(f"{key}: {val}")
        else:
            lines.append(str(rec))
        lines.append("─────────────────────────────────")
    
    lines.append("")
    lines.append("🎡᪵𝆺𝅥⃝𝐇ᴀᴄᴋᴇʀ ◡‌⃝ㅤㅤ")
    lines.append("⏳ Auto-delete in 30 seconds...")
    
    return "\n".join(lines)

# ====================== PROCESS SEARCH ======================
def process_search_async(chat_id, raw_text, wait_msg_id):
    lines = [line.strip() for line in raw_text.split('\n') if line.strip()]
    if not lines:
        bot.edit_message_text("❌ No input.", chat_id, wait_msg_id)
        return

    results = []
    for q in lines:
        bot.edit_message_text(f"⏳ Searching for {q}...\nThis may take a moment.", chat_id, wait_msg_id)
        
        status, resp = search_id(q)
        if status != 200:
            results.append(f"❌ Error for '{q}': {resp}")
        else:
            formatted = format_report(q, resp)
            results.append(formatted)

    final = "\n\n".join(results)
    
    try:
        sent_msg = bot.edit_message_text(final, chat_id, wait_msg_id)
        
        def delete_message():
            try:
                time.sleep(30)
                bot.delete_message(chat_id, sent_msg.message_id)
            except:
                pass
        
        threading.Thread(target=delete_message, daemon=True).start()
    except Exception as e:
        print(f"Error sending message: {e}")
        bot.send_message(chat_id, final)

